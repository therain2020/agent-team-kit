name: Team pack submission
description: Submit a team pack for the workshop and the community gallery.
title: "pack: "
labels: ["pack"]
body:
  - type: markdown
    attributes:
      value: |
        A team pack is plain YAML and Markdown — no runtime code required.
        Submissions are reviewed for validation, safety and a clear use case.
  - type: input
    id: name
    attributes:
      label: Team name
      placeholder: Weekly competitive radar
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What does this team do?
      description: The task, the buyer, and the definition of done.
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Where is the pack?
      description: Repo URL (pinned commit preferred) or path in this repository.
    validations:
      required: true
  - type: textarea
    id: agents
    attributes:
      label: Roles and workflow
      description: Seller / Builder / Specialist / Manager and the stages.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation output
      description: Paste `kit pack validate <dir>` and `kit pack simulate <dir>` (redact secrets).
      render: text
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Submission rules
      options:
        - label: The pack contains no API keys, tokens or private data.
          required: true
        - label: The pack has a license I can redistribute under.
          required: true
        - label: I understand third-party packs are untrusted content and are reviewed before listing.
          required: true
