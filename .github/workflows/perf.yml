name: perf

# `/office` acceptance benchmark (97 §5, 87 §4.5, issue #255).
#
# Deliberately NOT a job on every PR: shared-runner timing is noisy, and a
# blocked PR on a 50ms swing would make the gate meaningless. It runs on:
#   - a weekly schedule and pushes to `develop` (gate mode → fails on clear
#     regressions, not on noise; never blocks the PR that caused it);
#   - manual dispatch (gate mode by default);
#   - PRs that opt in with the `perf` label (advisory mode → publishes the
#     report, never blocks the PR).
# Clear regression = over the plan threshold by the regression factor
# (default ×1.25). Exact-threshold overshoot is reported as a warning.
on:
  schedule:
    - cron: "0 3 * * 1"
  # Integration signal after each merge; it never blocks the PR that caused it.
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      mode:
        description: "gate fails the job on a clear regression; advisory never does"
        type: choice
        options: [gate, advisory]
        default: gate
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: perf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  office-perf:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'perf')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Benchmark /office first paint and live updates
        env:
          BENCH_MODE: ${{ github.event_name == 'pull_request' && 'advisory' || (github.event_name == 'workflow_dispatch' && inputs.mode || 'gate') }}
          BENCH_SAMPLES: "20"
          BENCH_REPORT: .tmp/office-perf/office-perf.json
          GITHUB_SHA: ${{ github.sha }}
        run: bun run bench:office
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: office-perf-${{ github.sha }}
          path: .tmp/office-perf/office-perf.json
          if-no-files-found: warn
          retention-days: 90
