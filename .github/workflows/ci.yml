name: ci

on:
  push:
    branches: [master, "feat/**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      # Security invariant gate (70 §3.3/§5, 85 §3.6): failures block the PR.
      - run: bun run test:invariants
      - run: bun run test
