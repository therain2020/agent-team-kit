version: 1
rubrics:
  # Seller gate for kit-self-build (98 I-7). The evaluator scores the incoming
  # design from 0 to 1; any dimension under its threshold blocks the build.
  critic:
    dimensions:
      requirement_coverage:
        weight: 0.25
        threshold: 0.7
      evidence_provenance:
        weight: 0.2
        threshold: 0.6
      feasibility:
        weight: 0.2
        threshold: 0.6
      long_term_cost:
        weight: 0.15
        threshold: 0.6
      testability:
        weight: 0.1
        threshold: 0.6
      security_and_risk:
        weight: 0.1
        threshold: 0.7
