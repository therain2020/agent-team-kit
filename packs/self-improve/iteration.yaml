apiVersion: agentteam/v1
kind: IterationPack

planner:
  model: deepseek-pro
  maxTasks: 4

domains:
  cyber:
    workflow: security-audit
    coder: dsh
    agent: patcher
    riskCeiling: high
    verification: [typecheck, lint, test]
    instructions: |
      You are the builder for a cyber task. Find one concrete, verifiable
      security weakness in this repository, fix it with the smallest safe
      change, and explain the evidence. Do not attack third-party systems.
  ux:
    workflow: ux-improvement
    coder: dsh
    agent: frontend-builder
    riskCeiling: medium
    verification: [typecheck, lint, test]
    instructions: |
      You are the builder for a UX task. Find one concrete usability or
      clarity problem in the Manager Console task flow, make the smallest
      improvement, and keep the existing visual language.

  perf:
    workflow: ux-improvement
    coder: dsh
    agent: frontend-builder
    riskCeiling: medium
    verification: [typecheck, lint, test, bench]
    instructions: |
      You are the builder for a performance task in the Manager Console.
      Work from measured evidence, not guesses. Prefer production runtime,
      route-level loading boundaries and request-scoped data deduplication
      over micro-optimizations. Keep the change small, preserve the existing
      visual language, and do not weaken tests or security checks.

  docs:
    workflow: ux-improvement
    coder: dsh
    agent: patcher
    riskCeiling: low
    verification: [lint]
    instructions: |
      You are the builder for a documentation task. Update only documentation
      (README/CHANGELOG/docs). Do not change code or tests. Keep the edit small
      and consistent with the 0.9.0 autonomy preview.

autoApply:
  low: true
  medium: false
  high: false
